name: Continuous integration

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned runtime
        run: pnpm runtime:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit and contract tests
        run: pnpm test:unit

      - name: Verify package boundaries
        run: pnpm test:arch

      - name: Validate migrations
        run: pnpm test:migrations

      - name: Run adversarial plugin fixtures
        run: pnpm test:adversarial

      - name: Build production artifacts
        run: pnpm build

      - name: Prove deterministic plugin packaging
        run: pnpm plugin:pack packages/plugin-testkit/fixtures/normalized "${RUNNER_TEMP}/package-proof.launch-plugin"

      - name: Verify packaged artifact exists
        run: test -s "${RUNNER_TEMP}/package-proof.launch-plugin"

  browser-isolation:
    name: Browser isolation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser isolation proof
        run: pnpm test:browser

